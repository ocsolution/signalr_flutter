name: signalr_flutter
description: A flutter plugin for .net SignalR client. This client is for ASP.Net SignalR, not for .Net Core SignalR.
version: 0.2.0-dev.4
homepage: https://pub.dev/packages/signalr_flutter

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.4
  pigeon: ^3.0.3

flutter:
  plugin:
    platforms:
      android:
        package: dev.asdevs.signalr_flutter
        pluginClass: SignalrFlutterPlugin
      ios:
        pluginClass: SignalrFlutterPlugin